version: 2

builds:
  - main: .
    binary: atlassian-cli
    env:
      - CGO_ENABLED=0 # static binaries that run anywhere
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/zhani/atlassian-cli/cmd.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  use_existing_draft: true
  prerelease: auto # tags like v0.3.0-rc.1 become pre-releases
